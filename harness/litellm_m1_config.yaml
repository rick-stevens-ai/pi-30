# LiteLLM Aggregator B (m1) — fronts LOCAL-INFERENCE models on Spark + LM Studio.
# Single OpenAI-compatible endpoint; route by model_name.
# Companion to CherryRd Aggregator A (argo/alcf/cels server roster).
# Started via: litellm --config litellm_m1_config.yaml --host 0.0.0.0 --port 4001
# No DB required (general_settings store_model_in_db not set => in-memory).
#
# Spark36 (Ollama, OpenAI-compat): http://<tailnet-host>:11434/v1
# LM Studio (m3acbook):            http://<tailnet-host>:1234/v1
# Ollama/LM Studio need no real key; use a placeholder.

model_list:
  # ---- Spark36 (Ollama) capability-interesting open-weights ----
  - model_name: "spark/gpt-oss-120b"
    litellm_params:
      model: "openai/gpt-oss:120b"
      api_base: "http://<tailnet-host>:11434/v1"
      api_key: "ollama"
